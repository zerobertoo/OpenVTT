# Suggested labels. Not applied automatically; see CONTRIBUTING.md for how to create them with the gh CLI.
- { name: bug, color: d73a4a, description: Something does not work }
- { name: enhancement, color: a2eeef, description: New feature or improvement }
- { name: question, color: d876e3, description: Needs an answer, not a change }
- { name: documentation, color: 0075ca, description: Docs only }
- { name: good first issue, color: 7057ff, description: Small and well scoped, good for newcomers }
- { name: help wanted, color: 008672, description: Contributions welcome }
- { name: needs-triage, color: ededed, description: Not reviewed by a maintainer yet }
- { name: needs-info, color: fbca04, description: Waiting for more details from the reporter }
- { name: security, color: b60205, description: Hidden information leaks and other security bugs }
- { name: area/map, color: 1d76db, description: Map, tokens, grid, lighting, fog }
- { name: area/server, color: 1d76db, description: Server, protocol, persistence }
- { name: area/systems, color: 1d76db, description: Rules systems and sheets }
- { name: area/i18n, color: 1d76db, description: Translations }
- { name: area/ops, color: 1d76db, description: Docker, deployment, backups }
- { name: wontfix, color: ffffff, description: Will not be worked on }
- { name: duplicate, color: cfd3d7, description: Already reported }
