name: Bug report
description: Something does not work as documented
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If players can see something they should not (hidden tokens, walls, whispers, other sheets), **do not post it here**: use the [private report](https://github.com/zerobertoo/OpenVTT/security/advisories/new).
        Please read [Troubleshooting](https://github.com/zerobertoo/OpenVTT/blob/main/docs/troubleshooting.md) first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a world...
        2. Import a map...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A commit hash (`git rev-parse --short HEAD`) or the version in `package.json`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker Compose, Docker (other), From source (pnpm start), From source (pnpm dev), Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 150 on Windows 11
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      options: [Administrator, Game master, Assistant game master, Player, Observer, Not applicable]
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: Server output and the browser console (F12). Remove anything private.
      render: shell
